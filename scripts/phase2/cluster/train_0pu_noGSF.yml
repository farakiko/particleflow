# 0PU noGSF heptv2 training (2 MIG slices, DDP), to compare with moanwar's heptv2 training:
#   kubectl apply -f scripts/phase2/cluster/train_0pu_noGSF.yml
# Model pyg-cms-phase2-nopu-nogsf-heptv2 = his pyg-cms-ticl-v1 hyperparameters (per-step batch 128
# events, lr 4e-4 cosine) on cms_pf_phase2_{ttbar,qcd,zll}_nopu_nogsf, for exactly ONE epoch:
# NSTEPS = floor(ceil(N_train/2)/64) = 130031 for N_train = 16,643,977 (zll 2,140,251 + ttbar 3,993,041
# + qcd 10,510,685). Never set more than one epoch: training.py calls next() on the train iterator
# without re-iterating, so it raises StopIteration when the data runs out.
# tfds are read from EOS (DATADIR; built by tfds_build_noGSF.yml), so data loading is slower than /shared.
# Resumable (OnFailure + backoffLimit; resume_train.sh restarts from the latest checkpoint in EXP).
# Batch 128 = 2 GPUs x 4 x BMULT 16 (DDP, gradients averaged) = his 1 GPU x 4 x 32. One 12 GB slice
# with all 128 events peaked at 10.1/11.0 GB in a 200-step smoke test (2026-10-16), too tight for
# the rare long events; 64 per slice leaves margin. Smoke: ~1.07 s/step on 1 slice.
# Reading from EOS is latency bound: with 2 loader workers per rank the first launch ran at 0.87 s/step
# (0.28 s compute), so the model sets num_workers 8. 2 ranks x (8 train + 8 valid) workers at ~0.7 GB
# anon each is ~30 GB with the main processes, hence the 64Gi limit.
# To restart fresh: delete the Job AND its EXP dir.
apiVersion: batch/v1
kind: Job
metadata:
  name: pf-nopu-nogsf-heptv2
  namespace: fmokhtar
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: {home: "eos", mount-eos: "true"}
    spec:
      restartPolicy: OnFailure
      volumes:
      - name: shared
        persistentVolumeClaim: {claimName: shared}
      containers:
      - name: train
        image: registry.cern.ch/ngt/pytorch:2.3.1
        command: ["/bin/bash", "-c"]
        args:
        - bash /shared/particleflow/scripts/phase2/cluster/resume_train.sh
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        - {name: MODEL, value: "pyg-cms-phase2-nopu-nogsf-heptv2"}
        - {name: PROD, value: "cms_phase2_ngt"}
        - {name: DATADIR, value: "/eos/user/f/fmokhtar/mlpf/phase2/tfds"}
        - {name: EXP, value: "/shared/mlpf-phase2/experiments/nopu-nogsf-heptv2"}
        - {name: LOGNAME, value: "nopu_nogsf_heptv2"}
        - {name: GPUS, value: "2"}
        - {name: BMULT, value: "16"}
        - {name: NSTEPS, value: "130031"}
        - {name: VALFREQ, value: "10000"}
        - {name: CKPTFREQ, value: "10000"}
        - {name: NVALID, value: "50000"}
        volumeMounts: [{name: shared, mountPath: /shared}]
        resources:
          requests: {cpu: "8", memory: "24Gi"}
          limits: {cpu: "16", memory: "64Gi", nvidia.com/mig-1g.12gb: 2}
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-NVL
