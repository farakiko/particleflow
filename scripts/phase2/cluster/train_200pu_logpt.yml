# T3 + log(pt): our best clean-flag config (-pu-ctx, pt-weighted PU head + global context) plus a
# single log(element pt) input feature (use_logpt_feat, input_dim 38->39). One-knob change vs T3,
# trained on the clean tfds for the same 50k steps. Launch:
#   kubectl apply -f scripts/phase2/cluster/train_200pu_logpt.yml
---
apiVersion: batch/v1
kind: Job
metadata: {name: pf-ttbar200-ctx-logpt, namespace: fmokhtar}
spec:
  backoffLimit: 50
  template:
    metadata: {labels: {home: "eos", mount-eos: "true"}}
    spec:
      restartPolicy: OnFailure
      volumes: [{name: shared, persistentVolumeClaim: {claimName: shared}}]
      containers:
      - name: train
        image: registry.cern.ch/ngt/pytorch:2.3.1
        command: ["/bin/bash", "-c"]
        args: [bash /shared/particleflow/scripts/phase2/cluster/resume_train.sh]
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        - {name: MODEL, value: "pyg-cms-phase2-200pu-heptv2-pu-ctx-logpt"}
        - {name: PROD, value: "cms_phase2_ngt"}
        - {name: DATADIR, value: "/shared/mlpf-phase2/tfds_clean"}
        - {name: EXP, value: "/shared/mlpf-phase2/experiments/ttbar200-heptv2-pu-ctx-logpt-clean"}
        - {name: LOGNAME, value: "ttbar200_heptv2_pu_ctx_logpt_clean"}
        - {name: GPUS, value: "1"}
        - {name: BMULT, value: "1"}
        - {name: NSTEPS, value: "50000"}
        - {name: VALFREQ, value: "2500"}
        - {name: CKPTFREQ, value: "2500"}
        - {name: NVALID, value: "2000"}
        volumeMounts: [{name: shared, mountPath: /shared}]
        resources:
          requests: {cpu: "8", memory: "24Gi"}
          limits: {cpu: "16", memory: "48Gi", nvidia.com/mig-1g.12gb: 1}
      nodeSelector: {nvidia.com/gpu.product: NVIDIA-H100-NVL}
